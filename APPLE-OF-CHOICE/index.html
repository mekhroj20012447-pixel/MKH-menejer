<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06251b"><title>APPLE OF CHOICE</title><style>*{box-sizing:border-box}body{margin:0;padding:10px;background:radial-gradient(circle at top,#18553f,#041b14 75%);color:#fff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:780px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-weight:900;font-size:18px}.balance{background:#123d30;border:1px solid #39745d;border-radius:99px;padding:9px 13px;font-weight:900}.note{text-align:center;font-size:10px;opacity:.7;margin:8px}.card{background:#073326;border:1px solid #28634e;border-radius:20px;padding:13px;box-shadow:0 18px 55px #0008}.center{text-align:center}.hide{display:none!important}.bonus{background:#0c3b2c;border-radius:13px;padding:10px;margin:8px 0}.btn,.primary,.collect{border:0;border-radius:12px;padding:12px;font-weight:900;cursor:pointer;touch-action:manipulation}.btn{background:#164938;color:#fff}.primary{background:#8cffb0;color:#062016;width:100%}.collect{background:#b8ffcb;color:#062016;width:100%;font-size:15px}.stakes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}.custom{display:flex;gap:7px;margin:9px 0}.custom input{flex:1;min-width:0;background:#08271f;color:#fff;border:1px solid #39745d;border-radius:11px;padding:11px;font-size:16px;font-weight:800}.custom button{background:#8cffb0;color:#062016;border:0;border-radius:11px;padding:0 14px;font-weight:900}.board{display:flex;flex-direction:column;gap:6px}.row{display:grid;grid-template-columns:50px 1fr 58px;gap:5px;align-items:center;padding:5px;border-radius:13px;background:#0b3a2c;border:1px solid #1b5744}.row.active{border-color:#8cffb0;box-shadow:0 0 15px #8cffb044}.row.done{background:#104b36}.row.locked{opacity:.65}.rn,.mult{text-align:center;font-weight:900;font-size:9px}.mult{color:#b9d7c9}.apples{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.apple{height:47px;border:0;border-radius:11px;background:linear-gradient(145deg,#28654d,#0a3427);font-size:23px;color:transparent;cursor:pointer;touch-action:manipulation}.apple.open{color:#fff}.apple.safe{background:#26754c}.apple.bad{background:#713b36}.status{text-align:center;background:#0d3b2c;border-radius:11px;padding:8px;margin:8px 0;font-size:13px;font-weight:800}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.controls .collect{grid-column:1/-1}.small{font-size:10px;opacity:.7}@media(max-width:390px){.row{grid-template-columns:38px 1fr 44px}.apple{height:40px;font-size:20px}.rn,.mult{font-size:8px}}button:focus-visible{outline:3px solid white;outline-offset:2px}</style></head><body><main class="wrap"><div class="top"><div class="brand">🍎 APPLE OF CHOICE</div><div class="balance">🪙 <span id="bal">0</span></div></div><div class="note">TA'LIMIY SIMULYATSIYA — FAQAT VIRTUAL TANGALAR</div><section id="home" class="card center"><h2>O‘yinni boshlash</h2><div class="bonus"><b>🎁 KUNLIK BONUS — 10 000 TANGA</b><br><span id="bt">MAVJUD</span><br><button class="btn" id="bonus">BONUSNI OLISH</button></div><p>Stavkani tanlang:</p><div class="stakes" id="stakes"></div><div class="custom"><input id="stake" type="number" min="50" max="500000" value="100" inputmode="numeric" placeholder="50–500 000"><button id="set">QO‘YISH</button></div><button class="primary" id="start">O‘YINNI BOSHLASH</button><p class="small">Haqiqiy pul kiritish, chiqarish yoki mukofot yo‘q.</p></section><section id="game" class="card hide"><div style="display:flex;justify-content:space-between;font-size:13px"><b id="prog">1-qator</b><b>Mukofot: <span id="rew">120</span> 🪙</b></div><div id="board" class="board" style="margin-top:7px"></div><div id="status" class="status">1-qator: katakni tanlang</div><div class="controls"><button class="collect" id="collect">💰 MUKOFOTNI OLISH</button><button class="btn" id="again">🔄 QAYTA BOSHLASH</button><button class="btn" id="change">✏️ STAVKANI O‘ZGARTIRISH</button></div><p class="small" style="text-align:center">Mukofot bir raundda faqat bir marta hisoblanadi.</p></section><section id="result" class="card center hide"></section></main><script>'use strict';const M=[1.2,1.54,1.93,2.41,4.02,6.71,11.81,27.97,63.93,100],S=[4,4,4,4,3,3,3,2,2,1],KEY='apple_choice_uz';const oldKeys=['apple_choice_uz_final','apple_choice_uz_final2','apple_choice','appleGameData','apple_of_choice'];function parse(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}function blank(){return{balance:10000,bonus:0,games:0,wins:0,losses:0,safe:0,collected:0,lost:0,highestMultiplier:0,highestReward:0,streak:0,stops:[]}}let d=parse(KEY)||blank();if(!d.balance||d.balance<=0){let best=null;for(const k of oldKeys){const x=parse(k);if(x&&Number(x.balance)>Number(best?.balance||0))best=x}if(best&&Number(best.balance)>0)d=Object.assign(blank(),best);else d.balance=10000}localStorage.setItem(KEY,JSON.stringify(d));let stake=100,row=0,lay=[],busy=false,active=false,settled=false;const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(d));$('bal').textContent=Math.floor(d.balance).toLocaleString('uz-UZ')}function rnd(n){return crypto.getRandomValues(new Uint32Array(1))[0]%n}function valid(){let v=Math.floor(Number($('stake').value));if(!Number.isFinite(v)||v<50||v>500000){alert('Stavka 50 dan 500 000 tangagacha bo‘lishi kerak.');return null}return v}function layouts(){lay=[];for(let r=0;r<10;r++){let a=Array(S[r]).fill(1).concat(Array(5-S[r]).fill(0));for(let i=4;i;i--){let j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}lay.push(a)}}function makeStakes(){[50,100,250,500,1000,2500,5000].forEach(v=>{let b=document.createElement('button');b.className='btn';b.textContent=v.toLocaleString('uz-UZ');b.onclick=()=>{$('stake').value=v;stake=v};$('stakes').appendChild(b)})}function show(id){['home','game','result'].forEach(x=>$(x).classList.toggle('hide',x!==id))}function start(){let v=valid();if(v===null)return;if(v>d.balance)return alert('Virtual balansingiz yetarli emas.');stake=v;d.balance-=stake;d.games++;row=0;busy=false;active=true;settled=false;layouts();save();show('game');render()}function restart(){if(active&&!settled)return alert('Avval raundni tugating yoki mukofotni oling.');start()}function tile(b,s){b.textContent=s?'🍎':'🍏';b.classList.add('open',s?'safe':'bad')}function openRow(r){$('r'+r).querySelectorAll('.apple').forEach((b,c)=>tile(b,lay[r][c]))}function openAll(){for(let r=0;r<10;r++)openRow(r)}function render(){let board=$('board');board.innerHTML='';for(let r=0;r<10;r++){let q=document.createElement('div');q.id='r'+r;q.className='row '+(r===row?'active ':'')+(r<row?'done ':'')+(r>row?'locked':'');let n=document.createElement('div');n.className='rn';n.textContent=(r+1)+'-Q';let a=document.createElement('div');a.className='apples';let m=document.createElement('div');m.className='mult';m.textContent='x'+M[r].toFixed(2);for(let c=0;c<5;c++){let b=document.createElement('button');b.className='apple';b.type='button';b.textContent='?';b.disabled=r!==row||settled;if(r<row)tile(b,lay[r][c]);if(r===row)b.onclick=()=>choose(c);a.appendChild(b)}q.append(n,a,m);board.appendChild(q)}$('prog').textContent=(row+1)+'-qator';$('rew').textContent=Math.round(stake*M[Math.min(row,9)]).toLocaleString('uz-UZ');$('status').textContent=(row+1)+'-qator: katakni tanlang'}function choose(c){if(busy||!active||settled)return;busy=true;let ok=lay[row][c];openRow(row);if(ok){d.safe++;d.highestMultiplier=Math.max(d.highestMultiplier,M[row]);d.streak++;row++;if(row>=10){let reward=Math.round(stake*M[9]);settled=true;active=false;d.balance+=reward;d.collected+=reward;d.wins++;d.highestReward=Math.max(d.highestReward,reward);d.stops.push(10);save();finish('🏆 TABRIKLAYMIZ!',reward.toLocaleString('uz-UZ')+' virtual tanga olindi.')}else setTimeout(()=>{busy=false;render();$('r'+row).scrollIntoView({behavior:'smooth',block:'center'})},220)}else{d.losses++;d.lost+=stake;d.streak=0;settled=true;active=false;openAll();save();setTimeout(()=>finish('❌ O‘YIN TUGADI','Noto‘g‘ri katak tanlandi. Barcha qatorlar ochildi.'),200)}}function collect(){if(busy||!active||settled)return;busy=true;settled=true;active=false;let reward=Math.round(stake*M[row]);d.balance+=reward;d.collected+=reward;d.wins++;d.highestReward=Math.max(d.highestReward,reward);d.stops.push(row+1);save();finish('💚 MUKOFOT OLINDI',reward.toLocaleString('uz-UZ')+' virtual tanga balansingizga qo‘shildi.')}function finish(title,msg){show('result');$('result').innerHTML='<h2>'+title+'</h2><p>'+msg+'</p><button class="primary" id="play">QAYTA O‘YNASH</button><p class="small">Virtual tanga — haqiqiy pul emas.</p>';$('play').onclick=()=>{show('home');$('stake').value=stake;busy=false}}function claim(){if(d.bonus&&Date.now()-d.bonus<86400000)return;d.balance+=10000;d.bonus=Date.now();save();daily()}function daily(){let left=86400000-(Date.now()-(d.bonus||0));if(d.bonus&&left>0){$('bt').textContent='KEYINGI BONUS: '+new Date(left).toISOString().slice(11,19);$('bonus').disabled=true}else{$('bt').textContent='MAVJUD';$('bonus').disabled=false}}$('bonus').onclick=claim;$('start').onclick=start;$('again').onclick=restart;$('collect').onclick=collect;$('set').onclick=()=>{let v=valid();if(v!==null)stake=v};$('change').onclick=()=>{show('home');$('stake').value=stake};makeStakes();save();daily();setInterval(daily,1000);</script></body></html>
