<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple of Choice</title><style>body{margin:0;background:#06281e;color:#fff;font-family:system-ui;text-align:center;padding:20px}h1{color:#8cffb0}.card{max-width:600px;margin:auto;background:#0b3b2d;border-radius:24px;padding:20px}.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:20px 0}.tile{aspect-ratio:1;border:0;border-radius:18px;background:#174f3c;font-size:32px;cursor:pointer}.tile:active{transform:scale(.94)}button{padding:13px 18px;border:0;border-radius:14px;margin:5px;font-weight:700}#collect{background:#8cffb0}.hidden{display:none}.bad{background:#633}.good{background:#286b45}</style></head><body><div class="card"><small>EDUCATIONAL SIMULATION — VIRTUAL COINS ONLY</small><h1>🍎 APPLE OF CHOICE</h1><div>Balance: <b id="bal">10000</b> 🪙</div><div id="start"><h2>Choose stake</h2><button onclick="stake=50;go()">50</button><button onclick="stake=100;go()">100</button><button onclick="stake=250;go()">250</button><button onclick="stake=500;go()">500</button><button onclick="stake=1000;go()">1000</button></div><div id="game" class="hidden"><h2 id="row">ROW 1 · x1.20</h2><div class="tiles" id="tiles"></div><p>Potential reward: <b id="reward">120</b> 🪙</p><button id="collect" onclick="collect()">COLLECT</button></div><div id="result"></div></div><script>const mult=[1.2,1.54,1.93,2.41,4.02,6.71,11.81,27.97,63.93,100];const safe=[4,4,4,4,3,3,3,2,2,1];let bal=+localStorage.bal||10000,stake=100,row=0,layout=[];function save(){localStorage.bal=bal;document.getElementById('bal').textContent=bal}function go(){if(stake>bal)return alert('Insufficient coins');bal-=stake;row=0;layout=[];save();document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');newrow()}function newrow(){let a=Array(safe[row]).fill(1).concat(Array(5-safe[row]).fill(0));for(let i=a.length-1;i;i--){let j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}layout=a;document.getElementById('row').textContent=`ROW ${row+1} · x${mult[row].toFixed(2)}`;document.getElementById('reward').textContent=Math.round(stake*mult[row]);let t=document.getElementById('tiles');t.innerHTML='';a.forEach((x,i)=>{let b=document.createElement('button');b.className='tile';b.setAttribute('aria-label','Hidden apple');b.onclick=()=>pick(i,b);t.appendChild(b)})}function pick(i,b){if(!b||b.disabled)return;document.querySelectorAll('.tile').forEach(x=>x.disabled=true);if(layout[i]){b.textContent='🍎';b.classList.add('good');row++;if(row>=10){bal+=Math.round(stake*mult[9]);save();end('YOU COLLECTED '+Math.round(stake*mult[9])+' COINS')}else setTimeout(newrow,350)}else{b.textContent='🍏';b.classList.add('bad');setTimeout(()=>end('ROUND OVER — '+stake+' COINS LOST'),400)}}function collect(){let r=Math.round(stake*mult[row]);bal+=r;save();end('YOU COLLECTED '+r+' COINS')}function end(msg){document.getElementById('game').classList.add('hidden');document.getElementById('result').innerHTML='<h2>'+msg+'</h2><button onclick="location.reload()">PLAY AGAIN</button>'}save()</script></body></html>
