<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06251b"><title>APPLE OF CHOICE</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18553f,#061d17 72%);color:#fff;font-family:system-ui,-apple-system,sans-serif;padding:10px}.wrap{max-width:780px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.brand{font-weight:900;font-size:18px}.balance{background:#123d30;border:1px solid #2d7057;border-radius:99px;padding:8px 12px;font-weight:900}.note{text-align:center;font-size:10px;opacity:.75;margin:7px}.card{background:#093226;border:1px solid #28634e;border-radius:20px;padding:12px;box-shadow:0 18px 55px #0008}.hide{display:none!important}.center{text-align:center}.stakes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}.btn,.primary,.collect{border:0;border-radius:12px;padding:11px 13px;font-weight:900;cursor:pointer;touch-action:manipulation}.btn{background:#164938;color:#fff}.btn.sel,.primary{background:#8cffb0;color:#062016}.primary,.collect{width:100%;font-size:15px}.bonus{background:#0d392a;border-radius:13px;padding:10px;margin:8px 0}.custom{display:flex;gap:7px;margin:9px 0}.custom input{width:100%;min-width:0;border:1px solid #3c7b64;background:#08271f;color:#fff;border-radius:11px;padding:11px;font-size:16px;font-weight:800}.custom button{background:#8cffb0;color:#062016;border:0;border-radius:11px;padding:0 14px;font-weight:900}.board{display:flex;flex-direction:column;gap:6px}.row{display:grid;grid-template-columns:54px 1fr 56px;gap:5px;align-items:center;padding:5px;border-radius:13px;background:#0b3a2c;border:1px solid #1c5845}.row.active{border-color:#8cffb0;box-shadow:0 0 15px #8cffb044}.row.done{background:#104c36}.row.locked{opacity:.7}.rn,.mult{text-align:center;font-weight:900;font-size:10px}.mult{color:#b9d7c9}.apples{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.apple{height:48px;border:0;border-radius:11px;background:linear-gradient(145deg,#28654d,#0a3427);font-size:24px;color:transparent;cursor:pointer;touch-action:manipulation}.apple.open{color:#fff}.apple.safe{background:#26754c}.apple.bad{background:#713b36}.apple:disabled{cursor:default}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.controls .collect{grid-column:1/-1}.status{text-align:center;background:#0d3b2c;border-radius:11px;padding:8px;margin:8px 0;font-weight:800;font-size:13px}.small{font-size:10px;opacity:.7}@media(max-width:390px){.row{grid-template-columns:40px 1fr 46px}.apple{height:41px;font-size:21px}.rn,.mult{font-size:8px}}button:focus-visible{outline:3px solid white;outline-offset:2px}</style></head><body><main class="wrap"><div class="top"><div class="brand">🍎 APPLE OF CHOICE</div><div class="balance">🪙 <span id="balance">10 000</span></div></div><div class="note">TA'LIMIY SIMULYATSIYA — FAQAT VIRTUAL TANGALAR</div><section id="home" class="card center"><h2>O‘yinni boshlash</h2><div class="bonus"><b>🎁 KUNLIK BONUS</b><br><span id="bonusText">10 000 TANGA — MAVJUD</span><br><button type="button" class="btn" id="bonusButton">BONUSNI OLISH</button></div><p>Stavkani tanlang:</p><div id="stakes" class="stakes"></div><div class="custom"><input id="customStake" type="number" min="50" max="500000" step="1" inputmode="numeric" placeholder="50–500 000 tanga"><button type="button" id="customButton">QO‘YISH</button></div><button type="button" class="primary" id="startButton">O‘YINNI BOSHLASH</button><p class="small">Haqiqiy pul yo‘q. Pul kiritish yoki chiqarish yo‘q.</p></section><section id="game" class="card hide"><div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:7px;font-size:13px"><b id="progress">1-qator</b><b>Mukofot: <span id="reward">120</span> 🪙</b></div><div id="board" class="board"></div><div id="status" class="status">1-qator: katakni tanlang</div><div class="controls"><button type="button" class="collect" id="collectButton">💰 MUKOFOTNI OLISH</button><button type="button" class="btn" id="newRoundButton">🔄 QAYTA BOSHLASH</button><button type="button" class="btn" id="changeStakeButton">✏️ STAVKANI O‘ZGARTIRISH</button></div><p class="small" style="text-align:center">Bir raundda mukofot faqat bir marta hisoblanadi.</p></section><section id="result" class="card hide center"></section></main><script>'use strict';const MULT=[1.2,1.54,1.93,2.41,4.02,6.71,11.81,27.97,63.93,100],SAFE=[4,4,4,4,3,3,3,2,2,1],KEY='apple_choice_uz_final';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{balance:10000,bonus:0,games:0,wins:0,losses:0,safe:0,collected:0,lost:0,highestMultiplier:0,highestReward:0,streak:0,stops:[]};let stake=100,currentRow=0,layouts=[],busy=false,roundActive=false,settled=false;const el=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(data));el('balance').textContent=Math.floor(data.balance).toLocaleString('uz-UZ')}function randomInt(n){return crypto.getRandomValues(new Uint32Array(1))[0]%n}function show(id){['home','game','result'].forEach(x=>el(x).classList.toggle('hide',x!==id))}function makeStakes(){[50,100,250,500,1000,2500,5000].forEach(v=>{let b=document.createElement('button');b.type='button';b.className='btn'+(v===100?' sel':'');b.textContent=v.toLocaleString('uz-UZ');b.onclick=()=>{stake=v;el('customStake').value=v};el('stakes').appendChild(b)})}function applyCustom(){let v=Math.floor(Number(el('customStake').value));if(!Number.isFinite(v)||v<50||v>500000){alert('Stavka 50 dan 500 000 tangagacha bo‘lishi kerak.');return false}stake=v;return true}function daily(){let left=86400000-(Date.now()-data.bonus);if(data.bonus&&left>0){el('bonusText').textContent='KEYINGI BONUS: '+new Date(left).toISOString().slice(11,19);el('bonusButton').disabled=true}else{el('bonusText').textContent='10 000 TANGA — MAVJUD';el('bonusButton').disabled=false}}function claimBonus(){if(data.bonus&&Date.now()-data.bonus<86400000)return;data.balance+=10000;data.bonus=Date.now();save();daily()}function makeLayouts(){layouts=[];for(let r=0;r<10;r++){let a=Array(SAFE[r]).fill(true).concat(Array(5-SAFE[r]).fill(false));for(let i=4;i>0;i--){let j=randomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}layouts.push(a)}}function startGame(){if(!applyCustom())return;if(stake>data.balance)return alert('Balansingiz yetarli emas.');data.balance-=stake;data.games++;currentRow=0;busy=false;roundActive=true;settled=false;makeLayouts();save();show('game');renderBoard()}function restart(){if(roundActive&&!settled){return alert('Avval joriy raundni yakunlang yoki mukofotni oling.')}if(!applyCustom())return;startGame()}function renderBoard(){let board=el('board');board.innerHTML='';for(let r=0;r<10;r++){let row=document.createElement('div');row.className='row '+(r===currentRow?'active ':'')+(r<currentRow?'done ':'')+(r>currentRow?'locked':'');row.id='row-'+r;let n=document.createElement('div');n.className='rn';n.textContent=(r+1)+'-Q';let apples=document.createElement('div');apples.className='apples';let m=document.createElement('div');m.className='mult';m.textContent='x'+MULT[r].toFixed(2);for(let c=0;c<5;c++){let b=document.createElement('button');b.type='button';b.className='apple';b.textContent='?';b.disabled=r!==currentRow||settled;if(r<currentRow)openTile(b,layouts[r][c]);if(r===currentRow)b.onclick=()=>choose(c);apples.appendChild(b)}row.append(n,apples,m);board.appendChild(row)}el('progress').textContent=(currentRow+1)+'-qator';el('reward').textContent=Math.round(stake*MULT[Math.min(currentRow,9)]).toLocaleString('uz-UZ')}function openTile(b,safe){b.textContent=safe?'🍎':'🍏';b.classList.add('open',safe?'safe':'bad')}function openRow(r){el('row-'+r).querySelectorAll('.apple').forEach((b,c)=>openTile(b,layouts[r][c]))}function openAll(){for(let r=0;r<10;r++)openRow(r)}function choose(col){if(busy||!roundActive||settled)return;busy=true;let safe=layouts[currentRow][col];openRow(currentRow);if(safe){data.safe++;data.highestMultiplier=Math.max(data.highestMultiplier,MULT[currentRow]);data.streak++;currentRow++;if(currentRow===10){settled=true;roundActive=false;let reward=Math.round(stake*MULT[9]);data.balance+=reward;data.collected+=reward;data.highestReward=Math.max(data.highestReward,reward);data.wins++;data.stops.push(10);save();finish('🏆 TABRIKLAYMIZ!',reward.toLocaleString('uz-UZ')+' virtual tanga olindi.')}else{setTimeout(()=>{busy=false;renderBoard();el('row-'+currentRow).scrollIntoView({behavior:'smooth',block:'center'})},220)}}else{data.losses++;data.lost+=stake;data.streak=0;settled=true;roundActive=false;openAll();save();setTimeout(()=>finish('❌ O‘YIN TUGADI','Noto‘g‘ri katak. Barcha qatorlar ochildi.'),250)}}function collect(){if(busy||!roundActive||settled)return;busy=true;settled=true;roundActive=false;let reward=Math.round(stake*MULT[currentRow]);data.balance+=reward;data.collected+=reward;data.highestReward=Math.max(data.highestReward,reward);data.wins++;data.stops.push(currentRow+1);save();finish('💚 MUKOFOT OLINDI',reward.toLocaleString('uz-UZ')+' virtual tanga balansingizga qo‘shildi.')}function finish(title,msg){show('result');el('result').innerHTML='<h2>'+title+'</h2><p>'+msg+'</p><button type="button" class="primary" id="againButton">QAYTA O‘YNASH</button><p class="small">Bu faqat virtual tanga bilan ishlaydigan ta’limiy simulyatsiya.</p>';el('againButton').onclick=()=>{busy=false;show('home');el('customStake').value=stake}}el('bonusButton').onclick=claimBonus;el('customButton').onclick=applyCustom;el('startButton').onclick=startGame;el('collectButton').onclick=collect;el('newRoundButton').onclick=restart;el('changeStakeButton').onclick=()=>{show('home');el('customStake').value=stake};makeStakes();save();daily();setInterval(daily,1000);</script></body></html>
