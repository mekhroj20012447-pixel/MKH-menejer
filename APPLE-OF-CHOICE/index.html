<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06251b"><title>Apple of Choice</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:10px;background:radial-gradient(circle at top,#18553f,#041b14 78%);color:#fff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:780px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-weight:900;font-size:18px}.balance{background:#123d30;border:1px solid #39745d;border-radius:99px;padding:8px 12px;font-weight:900}.note{text-align:center;font-size:10px;opacity:.75;margin:8px}.card{background:#073326;border:1px solid #28634e;border-radius:20px;padding:13px;box-shadow:0 18px 55px #0008}.center{text-align:center}.hidden{display:none!important}.bonus{background:#0c3b2c;border-radius:13px;padding:10px;margin:8px 0}.btn,.primary,.collect{border:0;border-radius:12px;padding:12px;font-weight:900;cursor:pointer;touch-action:manipulation;min-height:44px}.btn{background:#164938;color:#fff}.primary{background:#8cffb0;color:#062016;width:100%}.collect{background:#b8ffcb;color:#062016;width:100%;font-size:15px}.stakes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}.custom{display:flex;gap:7px;margin:9px 0}.custom input{flex:1;min-width:0;background:#08271f;color:#fff;border:1px solid #39745d;border-radius:11px;padding:11px;font-size:16px;font-weight:800}.custom button{background:#8cffb0;color:#062016;border:0;border-radius:11px;padding:0 14px;font-weight:900}.board{display:flex;flex-direction:column;gap:6px;margin-top:8px}.row{display:grid;grid-template-columns:50px 1fr 58px;gap:5px;align-items:center;padding:5px;border-radius:13px;background:#0b3a2c;border:1px solid #1b5744}.row.active{border-color:#8cffb0;box-shadow:0 0 15px #8cffb044}.row.done{background:#104b36}.row.locked{opacity:.65}.rn,.mult{text-align:center;font-weight:900;font-size:9px}.mult{color:#b9d7c9}.apples{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.apple{height:47px;border:0;border-radius:11px;background:linear-gradient(145deg,#28654d,#0a3427);font-size:23px;color:transparent;cursor:pointer;touch-action:manipulation}.apple.open{color:#fff}.apple.safe{background:#26754c}.apple.bad{background:#713b36}.apple:disabled{cursor:default}.status{text-align:center;background:#0d3b2c;border-radius:11px;padding:8px;margin:8px 0;font-size:13px;font-weight:800}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.controls .collect{grid-column:1/-1}.small{font-size:10px;opacity:.7}.danger{background:#513535}@media(max-width:390px){.row{grid-template-columns:38px 1fr 44px}.apple{height:40px;font-size:20px}.rn,.mult{font-size:8px}}
</style></head>
<body><main class="wrap">
<div class="top"><div class="brand">🍎 APPLE OF CHOICE</div><div class="balance">🪙 <span id="balance">10 000</span></div></div>
<div class="note">TA'LIMIY SIMULYATSIYA — FAQAT VIRTUAL TANGALAR</div>
<section id="home" class="card center"><h2>O‘yinni boshlash</h2>
<div class="bonus"><b>🎁 KUNLIK BONUS — 10 000 TANGA</b><br><span id="bonusText">MAVJUD</span><br><button class="btn" id="bonusBtn" type="button">BONUSNI OLISH</button></div>
<p>Stavkani tanlang:</p><div id="stakeButtons" class="stakes"></div>
<div class="custom"><input id="stakeInput" type="number" min="50" max="500000" value="100" inputmode="numeric"><button class="btn" id="setStake" type="button">QO‘YISH</button></div>
<button class="primary" id="startBtn" type="button">O‘YINNI BOSHLASH</button>
<button class="btn" id="restoreBtn" type="button" style="margin-top:8px;width:100%">🪙 BALANSNI TIKLASH</button>
<p class="small">Haqiqiy pul kiritish, chiqarish yoki mukofot yo‘q.</p></section>
<section id="game" class="card hidden"><div style="display:flex;justify-content:space-between;font-size:13px"><b id="progress">1-qator</b><b>Mukofot: <span id="reward">120</span> 🪙</b></div><div id="board" class="board"></div><div id="status" class="status">1-qator: katakni tanlang</div><div class="controls"><button class="collect" id="collectBtn" type="button">💰 MUKOFOTNI OLISH</button><button class="btn" id="restartBtn" type="button">🔄 QAYTA BOSHLASH</button><button class="btn" id="changeBtn" type="button">✏️ STAVKANI O‘ZGARTIRISH</button></div></section>
<section id="result" class="card center hidden"></section></main>
<script>
(function(){'use strict';
const MULT=[1.20,1.54,1.93,2.41,4.02,6.71,11.81,27.97,63.93,100.00];
const SAFE=[4,4,4,4,3,3,3,2,2,1];
const KEY='apple_choice_stable_v1';
const OLD=['apple_choice_uz','apple_choice_uz_final','apple_choice_uz_final2','apple_choice','appleGameData','apple_of_choice'];
const $=id=>document.getElementById(id);
function base(){return {balance:10000,bonusAt:0,games:0,wins:0,losses:0,safe:0,collected:0,lost:0,highestMultiplier:0,highestReward:0,streak:0,stops:[]};}
function read(k){try{const x=localStorage.getItem(k);return x?JSON.parse(x):null}catch(e){return null}}
let saved=read(KEY);if(!saved){for(const k of OLD){const x=read(k);if(x&&typeof x==='object'){saved=x;break}}}
let data=Object.assign(base(),saved||{});data.balance=Math.max(0,Math.floor(Number(data.balance)||0));
let stake=100,currentRow=0,layouts=[],roundActive=false,settled=false,busy=false;
function save(){data.balance=Math.max(0,Math.floor(Number(data.balance)||0));localStorage.setItem(KEY,JSON.stringify(data));$('balance').textContent=data.balance.toLocaleString('uz-UZ');}
function randomIndex(n){if(window.crypto&&crypto.getRandomValues){return crypto.getRandomValues(new Uint32Array(1))[0]%n}return Math.floor(Math.random()*n)}
function validStake(){const v=Math.floor(Number($('stakeInput').value));if(!Number.isFinite(v)||v<50||v>500000){alert('Stavka 50 dan 500 000 tangagacha bo‘lishi kerak.');return null}return v}
function buildLayouts(){layouts=[];for(let r=0;r<10;r++){const a=[];for(let i=0;i<SAFE[r];i++)a.push(true);for(let i=SAFE[r];i<5;i++)a.push(false);for(let i=4;i>0;i--){const j=randomIndex(i+1);const t=a[i];a[i]=a[j];a[j]=t}layouts.push(a)}}
function show(id){['home','game','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function makeStakeButtons(){[50,100,250,500,1000,2500,5000].forEach(v=>{const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=v.toLocaleString('uz-UZ');b.addEventListener('click',function(){stake=v;$('stakeInput').value=v});$('stakeButtons').appendChild(b)})}
function daily(){const left=86400000-(Date.now()-(data.bonusAt||0));if(data.bonusAt&&left>0){$('bonusText').textContent='KEYINGI BONUS: '+new Date(left).toISOString().slice(11,19);$('bonusBtn').disabled=true}else{$('bonusText').textContent='MAVJUD';$('bonusBtn').disabled=false}}
function claimBonus(){if(data.bonusAt&&Date.now()-data.bonusAt<86400000)return;data.balance+=10000;data.bonusAt=Date.now();save();daily()}
function startGame(){const v=validStake();if(v===null)return;if(v>data.balance){alert('Virtual balansingiz yetarli emas.');return}stake=v;data.balance-=stake;data.games++;currentRow=0;roundActive=true;settled=false;busy=false;buildLayouts();save();show('game');render();}
function render(){const board=$('board');board.innerHTML='';for(let r=0;r<10;r++){const row=document.createElement('div');row.className='row '+(r===currentRow?'active ':'')+(r<currentRow?'done ':'')+(r>currentRow?'locked':'');row.id='row'+r;const label=document.createElement('div');label.className='rn';label.textContent=(r+1)+'-Q';const apples=document.createElement('div');apples.className='apples';const mult=document.createElement('div');mult.className='mult';mult.textContent='x'+MULT[r].toFixed(2);for(let c=0;c<5;c++){const b=document.createElement('button');b.type='button';b.className='apple';b.textContent='?';if(r<currentRow){reveal(b,layouts[r][c])}else if(r===currentRow&&!settled){b.addEventListener('click',function(){choose(c)});}else b.disabled=true;apples.appendChild(b)}row.append(label,apples,mult);board.appendChild(row)}$('progress').textContent=(currentRow+1)+'-qator';$('reward').textContent=Math.round(stake*MULT[Math.min(currentRow,9)]).toLocaleString('uz-UZ');$('status').textContent=(currentRow+1)+'-qator: katakni tanlang'}
function reveal(btn,safe){btn.textContent=safe?'🍎':'🍏';btn.classList.add('open',safe?'safe':'bad');btn.disabled=true}
function revealRow(r){const row=$('row'+r);if(!row)return;row.querySelectorAll('.apple').forEach((b,c)=>reveal(b,layouts[r][c]))}
function revealAll(){for(let r=0;r<10;r++)revealRow(r)}
function choose(col){if(busy||!roundActive||settled)return;busy=true;const safe=layouts[currentRow][col];revealRow(currentRow);if(safe){data.safe++;data.highestMultiplier=Math.max(data.highestMultiplier,MULT[currentRow]);data.streak++;currentRow++;if(currentRow>=10){const reward=Math.round(stake*MULT[9]);settled=true;roundActive=false;data.balance+=reward;data.collected+=reward;data.wins++;data.highestReward=Math.max(data.highestReward,reward);data.stops.push(10);save();finish('🏆 TABRIKLAYMIZ!',reward.toLocaleString('uz-UZ')+' virtual tanga olindi.')}else{setTimeout(function(){busy=false;render();const next=$('row'+currentRow);if(next)next.scrollIntoView({behavior:'smooth',block:'center'})},180)}}else{data.losses++;data.lost+=stake;data.streak=0;settled=true;roundActive=false;revealAll();save();setTimeout(function(){finish('❌ O‘YIN TUGADI','Noto‘g‘ri katak tanlandi. Barcha 10 qator ochildi.')},180)}}
function collect(){if(busy||!roundActive||settled)return;busy=true;const reward=Math.round(stake*MULT[currentRow]);settled=true;roundActive=false;data.balance+=reward;data.collected+=reward;data.wins++;data.highestReward=Math.max(data.highestReward,reward);data.stops.push(currentRow+1);save();finish('💚 MUKOFOT OLINDI',reward.toLocaleString('uz-UZ')+' virtual tanga balansingizga qo‘shildi.')}
function finish(title,msg){show('result');$('result').innerHTML='<h2>'+title+'</h2><p>'+msg+'</p><button class="primary" id="playAgain" type="button">QAYTA O‘YNASH</button><p class="small">Virtual tanga — haqiqiy pul emas.</p>';$('playAgain').addEventListener('click',function(){show('home');$('stakeInput').value=stake;busy=false})}
function restart(){if(roundActive&&!settled){alert('Avval raundni tugating yoki mukofotni oling.');return}startGame()}
function restore(){let best=data;for(const k of OLD){const x=read(k);if(x&&Number(x.balance||0)>Number(best.balance||0))best=x}if(Number(best.balance)>0){data=Object.assign(base(),best);save();alert('Balans tiklandi: '+data.balance.toLocaleString('uz-UZ')+' tanga.')}else{data=base();save();daily();alert('10 000 virtual tanga tiklandi.')}}
$('bonusBtn').addEventListener('click',claimBonus);$('startBtn').addEventListener('click',startGame);$('collectBtn').addEventListener('click',collect);$('restartBtn').addEventListener('click',restart);$('changeBtn').addEventListener('click',function(){show('home');$('stakeInput').value=stake});$('setStake').addEventListener('click',function(){const v=validStake();if(v!==null)stake=v});$('restoreBtn').addEventListener('click',restore);
makeStakeButtons();save();daily();setInterval(daily,1000);
})();
</script></body></html>
