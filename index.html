<!doctype html><html lang="uz"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>EMBERFRONT RTS</title><style>*{box-sizing:border-box;touch-action:none}body{margin:0;overflow:hidden;background:#071116;color:#fff;font:12px system-ui}canvas{display:block;width:100vw;height:100vh}.ui{position:fixed;inset:0;pointer-events:none}.top,.panel{background:#071116dd;border:1px solid #ffffff20;border-radius:12px}.top{position:absolute;top:8px;left:8px;right:8px;height:50px;padding:8px;display:flex;gap:7px;align-items:center}.brand{font-weight:900;letter-spacing:2px;margin-right:auto}.r{padding:7px 9px;background:#ffffff0a;border-radius:8px}.panel{position:absolute;right:8px;bottom:8px;width:min(250px,62vw);padding:8px;pointer-events:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.b{height:48px;background:#ffffff0a;color:#fff;border:1px solid #ffffff15;border-radius:9px}.hint{position:absolute;left:8px;bottom:8px;max-width:45%;padding:8px;background:#071116bb;border-radius:9px;font-size:10px}.start{position:fixed;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#173d48,#04090d 70%)}.card{width:min(410px,calc(100% - 28px));padding:25px;border-radius:20px;background:#09151df2;border:1px solid #ffffff20;text-align:center}.card h1{font-size:30px;letter-spacing:5px;margin:0}.card p{opacity:.7;line-height:1.5}.go{width:100%;padding:14px;border:0;border-radius:12px;background:#e0ad43;font-weight:900}</style><canvas id=c></canvas><div class=ui><div class=top><b class=brand>EMBERFRONT</b><span class=r>🟡 <i id=g>350</i></span><span class=r>🟢 <i id=w>250</i></span><span class=r>⚪ <i id=s>120</i></span></div><div id=p class=panel style="display:none"><b>BUYRUQLAR</b><div id=grid class=grid></div></div><div class=hint>Tanlang → xaritaga bosing: yurish. Dushmanga bosing: hujum. Drag: kamera.</div></div><div id=start class=start><div class=card><h1>EMBERFRONT</h1><p>Original mobile real-time strategy. Resurs yig'ing, qo'shin yarating va dushman Ember Core'ini yo'q qiling.</p><button id=go class=go>JANGNI BOSHLASH</button></div></div><script>let C=c,X=C.getContext('2d'),W,H,run=0,z=1,cam={x:1500,y:950},sel=null,drag,last=0,R=[],U=[],B=[],res={g:350,w:250,s:120};function sz(){W=innerWidth;H=innerHeight;C.width=W*devicePixelRatio;C.height=H*devicePixelRatio;X.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}onresize=sz;sz();const rnd=(a,b)=>a+Math.random()*(b-a),types={worker:[60,65,5,22],blade:[150,75,18,30],archer:[90,65,15,145],guard:[260,50,28,30]};function u(t,x,y,f){let d=types[t];return{t,x,y,f,h:d[0],m:d[0],sp:d[1],d:d[2],rg:d[3],cd:0,target:null,order:null,carry:0}}function b(t,x,y,f){return{t,x,y,f,h:t==='core'?1500:600,m:t==='core'?1500:600,r:t==='core'?65:45,cd:0,Q:[]}}function reset(){R=[];U=[];B=[];res={g:350,w:250,s:120};B.push(b('core',480,950,0),b('barracks',650,950,0),b('tower',760,820,0),b('core',2520,950,1),b('barracks',2360,950,1),b('tower',2240,830,1),b('tower',2240,1070,1));for(let i=0;i<4;i++)U.push(u('worker',550+i*25,1040,0));U.push(u('blade',700,990,0),u('archer',730,1015,0));for(let i=0;i<3;i++)U.push(u('blade',2380+i*28,1030,1));U.push(u('archer',2320,880,1));for(let i=0;i<22;i++)R.push({x:rnd(850,2150),y:rnd(220,1680),t:Math.random()<.55?'g':'w',n:500})}function wp(sx,sy){return{x:(sx-W/2)/z+cam.x,y:(sy-H/2)/z+cam.y}}function hit(x,y){for(let i=U.length-1;i>=0;i--)if(Math.hypot(x-U[i].x,y-U[i].y)<18)return U[i];for(let i=B.length-1;i>=0;i--)if(Math.hypot(x-B[i].x,y-B[i].y)<B[i].r+10)return B[i]}function near(a,f,rg=1e9){let o=null,d=rg;for(let q of U.concat(B))if(q.f!=f){let n=Math.hypot(a.x-q.x,a.y-q.y);if(n<d)d=n,o=q}return o}function move(a,x,y,dt){let dx=x-a.x,dy=y-a.y,d=Math.hypot(dx,dy);if(d<3)return 1;let n=Math.min(d,a.sp*dt);a.x+=dx/d*n;a.y+=dy/d*n;return d<5}function hurt(a,n){a.h-=n;if(a.h<=0){if(a.t==='core'){run=0;start.style.display='flex';start.querySelector('h1').textContent=a.f?'VICTORY':'DEFEAT'}else if(U.includes(a))U=U.filter(q=>q!=a);else B=B.filter(q=>q!=a)}}function train(t){let c={worker:[50,0,0],blade:[70,25,0],archer:[60,45,0],guard:[120,40,25]}[t];if(res.g<c[0]||res.w<c[1]||res.s<c[2])return;res.g-=c[0];res.w-=c[1];res.s-=c[2];sel.Q.push({t,n:t==='worker'?2.5:4})}function menu(){grid.innerHTML='';[['👷','worker'],['⚔','blade'],['🏹','archer'],['🛡','guard']].forEach(v=>{let q=document.createElement('button');q.className='b';q.textContent=v[0];q.onclick=()=>train(v[1]);grid.appendChild(q)})}function select(a){sel=a;p.style.display=a&&a.f===0&&(a.t==='core'||a.t==='barracks')?'block':'none';if(p.style.display==='block')menu()}function update(dt){for(let b of B)if(b.Q.length){b.Q[0].n-=dt;if(b.Q[0].n<=0){let q=b.Q.shift(),a=rnd(0,6.28),d=b.r+25;U.push(u(q.t,b.x+Math.cos(a)*d,b.y+Math.sin(a)*d,b.f))}}for(let a of U){if(a.f===0&&a.t==='worker'){let r=R.find(q=>q.n>0),home=B[0];if(r){if(a.carry>=25){if(move(a,home.x,home.y,dt)){res[r.t]+=a.carry;a.carry=0}}else if(move(a,r.x,r.y,dt)){a.carry=Math.min(25,a.carry+dt*8);r.n-=dt*8}}}else{a.target=a.target&&a.target.h>0?a.target:near(a,a.f,320);if(a.order){if(move(a,a.order.x,a.order.y,dt))a.order=null}else if(a.target){let d=Math.hypot(a.target.x-a.x,a.target.y-a.y);if(d>a.rg)move(a,a.target.x,a.target.y,dt);else if((a.cd-=dt)<=0){a.cd=.8;hurt(a.target,a.d)}}}}for(let b of B.filter(q=>q.f===1&&(q.t==='core'||q.t==='barracks')))if(b.Q.length<2)b.Q.push({t:Math.random()<.55?'blade':'archer',n:5});for(let b of B.filter(q=>q.t==='tower'))if((b.cd-=dt)<=0){let e=near(b,b.f,330);if(e){b.cd=1.4;hurt(e,20)}}g.textContent=Math.floor(res.g);w.textContent=Math.floor(res.w);s.textContent=Math.floor(res.s)}function draw(){X.clearRect(0,0,W,H);X.save();X.translate(W/2,H/2);X.scale(z,z);X.translate(-cam.x,-cam.y);X.fillStyle='#17372f';X.fillRect(0,0,3000,1900);X.fillStyle='#123746';X.fillRect(1430,0,160,1900);X.strokeStyle='#ffffff09';for(let i=0;i<3000;i+=80){X.beginPath();X.moveTo(i,0);X.lineTo(i,1900);X.stroke()}for(let r of R)if(r.n>0){X.fillStyle=r.t==='g'?'#d5ad43':'#5f9c61';X.beginPath();X.arc(r.x,r.y,18,0,7);X.fill()}for(let b of B){X.fillStyle=b.f?'#69302d':'#24556a';X.fillRect(b.x-b.r,b.y-b.r,b.r*2,b.r*2);X.strokeStyle=b.f?'#ef6d55':'#55c7ff';X.lineWidth=4;X.strokeRect(b.x-b.r,b.y-b.r,b.r*2,b.r*2)}for(let a of U){X.fillStyle=a.f?'#ef6d55':'#55c7ff';X.beginPath();X.arc(a.x,a.y,a.t==='guard'?14:10,0,7);X.fill();if(a===sel){X.strokeStyle='#f4d46a';X.beginPath();X.arc(a.x,a.y,18,0,7);X.stroke()}}X.restore()}function loop(n){let dt=Math.min(.04,(n-last)/1000);last=n;if(run)update(dt);draw();requestAnimationFrame(loop)}C.onpointerdown=e=>{if(run)drag={x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,m:0}};C.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.lx,dy=e.clientY-drag.ly;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6)drag.m=1;if(drag.m){cam.x-=dx/z;cam.y-=dy/z}drag.lx=e.clientX;drag.ly=e.clientY};C.onpointerup=e=>{if(!drag)return;let d=drag;drag=null;if(!d.m){let q=wp(e.clientX,e.clientY),h=hit(q.x,q.y);if(sel&&sel.f===0&&sel.t!=='worker'&&h&&h.f===1)sel.target=h;else if(sel&&sel.f===0&&sel.t!=='worker'&&!h)sel.order=q;else select(h)}};C.onwheel=e=>z=Math.max(.5,Math.min(1.7,z*(e.deltaY>0?.9:1.1)));go.onclick=()=>{reset();run=1;start.style.display='none'};reset();requestAnimationFrame(loop)</script></html>
