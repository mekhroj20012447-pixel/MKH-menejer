<!doctype html>

<title>REALM CLASH — Mobile RTS</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100c;font-family:system-ui,Arial;color:#f7e6b0;touch-action:none}#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:8px;left:8px;right:8px;height:56px;display:flex;align-items:center;gap:7px;padding:7px 9px;background:linear-gradient(#14251ee8,#08120edb);border:1px solid #d7b65a55;border-radius:14px;box-shadow:0 5px 25px #0008}.brand{font-weight:1000;letter-spacing:2px;color:#ffd96a;text-shadow:0 2px 8px #000;font-size:14px;margin-right:auto}.r{padding:7px 9px;border-radius:10px;background:#ffffff0b;border:1px solid #ffffff12;font-weight:800;min-width:58px;text-align:center}.info{position:absolute;left:9px;bottom:120px;max-width:min(360px,72vw);padding:8px 11px;border-radius:11px;background:#06100ddd;border:1px solid #ffffff16;font-size:11px;line-height:1.35;box-shadow:0 4px 18px #0008}.panel{position:absolute;left:9px;right:9px;bottom:8px;min-height:96px;padding:8px;background:linear-gradient(#15261fe8,#07110ddd);border:1px solid #d7b65a55;border-radius:16px;pointer-events:auto;box-shadow:0 8px 28px #0009}.panelTitle{font-size:11px;color:#ffd96a;margin-bottom:6px;font-weight:900;letter-spacing:1px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.b{min-height:60px;border:1px solid #ffffff1b;border-radius:11px;background:linear-gradient(#26382f,#111e18);color:#fff;font-weight:800;font-size:10px;padding:4px}.b:active{transform:scale(.96);border-color:#ffd96a}.b small{display:block;color:#b8c3b9;font-size:8px;margin-top:2px}.msg{position:absolute;top:75px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:12px;background:#06100eef;border:1px solid #ffd96a66;color:#ffe7a0;font-weight:800;opacity:0;transition:.2s}.start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 25%,#244f3a,#07110d 65%,#020403)}.card{width:min(430px,calc(100% - 28px));padding:28px;border-radius:24px;background:linear-gradient(145deg,#10251beF,#07100df5);border:1px solid #e0bc5a66;text-align:center;box-shadow:0 20px 80px #000c}.card h1{margin:0;color:#ffd96a;font-size:34px;letter-spacing:5px;text-shadow:0 5px 20px #000}.card p{color:#c5cdbf;line-height:1.55;font-size:13px}.go{width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(#f5cf6a,#b78627);font-weight:1000;color:#211704;font-size:16px}.hidden{display:none!important}
</style>

<body>
<canvas id="c"></canvas>
<div class="ui">
 <div class="top"><b class="brand">⚔ REALM CLASH</b><span class="r">🟡 <i id="g">1000</i></span><span class="r">🟢 <i id="w">1000</i></span><span class="r">👥 <i id="pop">7/30</i></span></div>
 <div id="info" class="info">Ishchi tanlang. 7 ta ishchi bo‘lsa avtomatik: 4 ta oltin, 3 ta daraxt.</div>
 <div id="msg" class="msg"></div>
 <div id="panel" class="panel hidden"><div id="pt" class="panelTitle">BUYRUQLAR</div><div id="grid" class="grid"></div></div>
</div>
<div id="start" class="start"><div class="card"><h1>REALM CLASH</h1><p>Original mobil RTS. Bazangizni rivojlantiring, resurs yig‘ing, mudofaa minoralari quring va dushman qal’asini zabt eting.</p><p>🟡 <b>1000 oltin</b> · 🟢 <b>1000 yog‘och</b> · 👷 <b>7 ishchi</b></p><button id="go" class="go">JANGNI BOSHLASH</button></div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');let W,H,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;C.width=W*DPR;C.height=H*DPR;X.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const WORLD={w:3200,h:2100};let cam={x:700,y:1050},zoom=1,run=false,sel=null,drag=null,last=performance.now(),uid=1;
let res={g:1000,w:1000},units=[],buildings=[],nodes=[],fx=[];let msgTimer=0;
const defs={worker:{hp:65,sp:74,dmg:5,range:24,r:12,cost:[50,0],time:2.5},blade:{hp:170,sp:70,dmg:22,range:32,r:14,cost:[80,25],time:3.8},archer:{hp:95,sp:68,dmg:17,range:170,r:12,cost:[70,45],time:4.2},guard:{hp:300,sp:50,dmg:30,range:34,r:16,cost:[130,55],time:5}};
const labels={worker:'Usta',blade:'Jangchi',archer:'Kamonchi',guard:'Qo‘riqchi'};
function U(t,x,y,f=0){let d=defs[t];return{id:uid++,t,x,y,f,h:d.hp,m:d.hp,sp:d.sp,dmg:d.dmg,range:d.range,r:d.r,cd:0,target:null,order:null,carry:0,carryType:null,auto:true,hitFlash:0}}
function B(t,x,y,f=0){let core=t==='core',tower=t==='tower';return{id:uid++,t,x,y,f,h:core?2200:tower?420:650,m:core?2200:tower?420:650,r:core?78:tower?42:52,Q:[],cd:0,flash:0}}
function N(t,x,y){return{x,y,t,n:1000,r:t==='gold'?25:20}}
function setup(){units=[];buildings=[];nodes=[];fx=[];res={g:1000,w:1000};uid=1;
 buildings.push(B('core',430,1040,0),B('barracks',620,1040,0),B('tower',760,930,0),B('tower',760,1150,0),B('core',2770,1040,1),B('barracks',2590,1040,1),B('tower',2440,930,1),B('tower',2440,1150,1));
 for(let i=0;i<7;i++)units.push(U('worker',520+(i%4)*28,1130+Math.floor(i/4)*25,0));
 units.push(U('blade',700,1030,0),U('blade',730,1070,0),U('archer',750,1010,0));
 for(let i=0;i<4;i++)units.push(U('worker',2710-(i%2)*25,1130+Math.floor(i/2)*28,1));
 for(let i=0;i<4;i++)units.push(U('blade',2500+i*30,1040,1));units.push(U('archer',2490,990,1));
 for(let i=0;i<30;i++){let side=i<15?0:1;let x=side?1700+Math.random()*900:900+Math.random()*700;let y=260+Math.random()*1500;nodes.push(N(Math.random()<.5?'gold':'wood',x,y))}
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function wp(sx,sy){return{x:(sx-W/2)/zoom+cam.x,y:(sy-H/2)/zoom+cam.y}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function findUnit(x,y){for(let i=units.length-1;i>=0;i--)if(Math.hypot(x-units[i].x,y-units[i].y)<units[i].r+12)return units[i];return null}
function findBuilding(x,y){for(let i=buildings.length-1;i>=0;i--)if(Math.hypot(x-buildings[i].x,y-buildings[i].y)<buildings[i].r+12)return buildings[i];return null}
function nearestEnemy(a,range=Infinity){let best=null,bd=range;for(const q of units)if(q.f!==a.f&&q.h>0){let d=dist(a,q);if(d<bd){bd=d;best=q}}for(const q of buildings)if(q.f!==a.f&&q.h>0){let d=dist(a,q);if(d<bd){bd=d;best=q}}return best}
function nearestNode(type){let best=null,bd=Infinity;for(const n of nodes)if(n.n>0&&(!type||n.t===type)){let d=Math.hypot(n.x-units[0].x,n.y-units[0].y);if(d<bd){bd=d;best=n}}return best}
function home(f){return buildings.find(b=>b.f===f&&b.t==='core')}
function say(s){const m=document.getElementById('msg');m.textContent=s;m.style.opacity=1;clearTimeout(msgTimer);msgTimer=setTimeout(()=>m.style.opacity=0,1700)}
function move(a,x,y,dt){let dx=x-a.x,dy=y-a.y,d=Math.hypot(dx,dy);if(d<4)return true;let step=Math.min(d,a.sp*dt);a.x+=dx/d*step;a.y+=dy/d*step;return d<7}
function damage(target,n,from){target.h-=n;target.flash=.12;fx.push({x:target.x,y:target.y,t:0,type:'hit'});if(from&&from.t==='archer')fx.push({x:from.x,y:from.y,tx:target.x,ty:target.y,t:0,type:'arrow'});if(target.h<=0){fx.push({x:target.x,y:target.y,t:0,type:'boom'});if(target.t==='core'){run=false;document.getElementById('start').classList.remove('hidden');document.querySelector('#start h1').textContent=target.f?'G‘ALABA!':'MAG‘LUBIYAT';document.querySelector('#start p').textContent=target.f?'Dushman qal’asi qulatildi!':'Qal’angiz yo‘q qilindi.'}buildings=buildings.filter(q=>q!==target);units=units.filter(q=>q!==target)}}
function spend(cost){if(res.g<cost[0]||res.w<cost[1]){say('Resurs yetarli emas');return false}res.g-=cost[0];res.w-=cost[1];return true}
function train(type,building){let d=defs[type];if(!spend(d.cost))return;building.Q.push({t:type,n:d.time});say(labels[type]+' tayyorlanmoqda')}
function addBuilding(type,x,y){let cost=type==='tower'?[100,100]:type==='house'?[50,50]:[180,100];if(!spend(cost))return;buildings.push(B(type,x,y,0));say(type==='tower'?'Mudofaa vishkasi qurildi':'Bino qurildi')}
function select(a){sel=a;renderPanel();if(a)say(labels[a.t]||({core:'Qal’a',barracks:'Qarorgoh',tower:'Himoya vishkasi',house:'Uy'}[a.t]||'Tanlandi'))}
function renderPanel(){let p=document.getElementById('panel'),g=document.getElementById('grid');g.innerHTML='';if(!sel||sel.f!==0){p.classList.add('hidden');return}p.classList.remove('hidden');document.getElementById('pt').textContent=sel.t==='worker'?'ISHCHI BUYRUQLARI':sel.t==='tower'?'HIMOYA VISHKASI':'BAZA BUYRUQLARI';
 let buttons=[];if(sel.t==='barracks'||sel.t==='core')buttons=[['⚔️','Jangchi','blade'],['🏹','Kamonchi','archer'],['🛡️','Qo‘riqchi','guard']];if(sel.t==='worker')buttons=[['🏯','Vishka','tower'],['🏠','Uy','house']];
 buttons.forEach(v=>{let b=document.createElement('button');b.className='b';b.innerHTML=v[0]+'<br>'+v[1];b.onclick=()=>v[2]==='tower'||v[2]==='house'?placing=v[2]:train(v[2],sel);g.appendChild(b)});if(!buttons.length){let b=document.createElement('button');b.className='b';b.textContent='✓ Avto mudofaa';g.appendChild(b)}}
let placing=null;
function workerRoles(){let ws=units.filter(u=>u.f===0&&u.t==='worker'&&u.h>0);if(ws.length>=7){ws.slice(0,4).forEach(w=>assignResource(w,'gold'));ws.slice(4,7).forEach(w=>assignResource(w,'wood'));}}
function assignResource(w,type){let candidates=nodes.filter(n=>n.n>0&&n.t===type);if(!candidates.length)return;let best=candidates.sort((a,b)=>Math.hypot(a.x-w.x,a.y-w.y)-Math.hypot(b.x-w.x,b.y-w.y))[0];w.resource=best;w.carry=0}
function updateWorkers(dt){let ws=units.filter(u=>u.f===0&&u.t==='worker');if(ws.length>=7)workerRoles();for(const a of ws){let n=a.resource;if(!n||n.n<=0){assignResource(a,a.resource?.t||'gold');n=a.resource}if(!n)continue;let h=home(0);if(a.carry>=30){if(move(a,h.x,h.y,dt)){res[a.carryType||n.t]+=30;a.carry=0}}else if(move(a,n.x,n.y,dt)){a.carry=Math.min(30,a.carry+dt*10);n.n=Math.max(0,n.n-dt*10);a.carryType=n.t}}}
function autoArmy(){let arch=units.filter(u=>u.f===0&&u.t==='archer'&&u.h>0),fight=units.filter(u=>u.f===0&&u.t==='blade'&&u.h>0);if(arch.length>=5)arch.forEach(a=>a.order={x:home(1).x,y:home(1).y});if(fight.length>=5)fight.forEach(a=>a.order={x:home(1).x,y:home(1).y})}
function defendPlayer(){let enemyNear=units.find(e=>e.f===1&&e.h>0&&Math.hypot(e.x-home(0).x,e.y-home(0).y)<700);if(!enemyNear)return;let defenders=units.filter(u=>u.f===0&&u.t!=='worker'&&u.h>0);defenders.forEach(a=>a.target=nearestEnemy(a,900));let ws=units.filter(u=>u.f===0&&u.t==='worker'&&u.h>0);ws.forEach(w=>{if(Math.hypot(w.x-enemyNear.x,w.y-enemyNear.y)<450){let h=home(0);w.order={x:h.x+80,y:h.y+80}}})}
function enemyAI(dt){let army=units.filter(u=>u.f===1&&u.t!=='worker'&&u.h>0);army.forEach(a=>{let target=nearestEnemy(a,650);if(target)a.target=target;else if(!a.order)a.order={x:home(0).x,y:home(0).y}});let barr=buildings.find(b=>b.f===1&&b.t==='barracks');if(barr&&b.Q.length<2){let type=Math.random()<.55?'blade':'archer';let d=defs[type];/* enemy has its own income */if(!barr._gold)barr._gold=250;if(!barr._wood)barr._wood=160;if(barr._gold>=d.cost[0]&&barr._wood>=d.cost[1]){barr._gold-=d.cost[0];barr._wood-=d.cost[1];barr.Q.push({t:type,n:d.time})}else{barr._gold+=dt*18;barr._wood+=dt*10}}}
function update(dt){updateWorkers(dt);autoArmy();defendPlayer();enemyAI(dt);
 for(const b of buildings){if(b.Q.length){b.Q[0].n-=dt;if(b.Q[0].n<=0){let q=b.Q.shift(),ang=Math.random()*6.28,d=b.r+28;units.push(U(q.t,b.x+Math.cos(ang)*d,b.y+Math.sin(ang)*d,b.f));if(b.f===0)say(labels[q.t]+' tayyor!')}}if(b.t==='tower'){b.cd-=dt;if(b.cd<=0){let e=nearestEnemy(b,430);if(e){b.cd=1.2;damage(e,26,b);fx.push({x:b.x,y:b.y,tx:e.x,ty:e.y,t:0,type:'bolt'})}}}}
 for(const a of units){if(a.h<=0)continue;a.hitFlash=Math.max(0,a.hitFlash-dt);if(a.order){if(move(a,a.order.x,a.order.y,dt)){a.order=null; if(a.t!=='worker')a.target=nearestEnemy(a,300)}}if(a.t!=='worker'){let threat=a.target&&a.target.h>0?a.target:null;if(!threat&&a.f===0)threat=nearestEnemy(a,340);if(threat){let d=dist(a,threat);if(d>a.range+threat.r)move(a,threat.x,threat.y,dt);else if((a.cd-=dt)<=0){a.cd=a.t==='archer'?1.05:.7;damage(threat,a.dmg,a)}}}}
 document.getElementById('g').textContent=Math.floor(res.g);document.getElementById('w').textContent=Math.floor(res.w);document.getElementById('pop').textContent=units.filter(u=>u.f===0).length+'/30';fx=fx.filter(f=>{f.t+=dt;return f.t<.55})}
function rounded(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r);X.fill()}
function tree(x,y,scale=1){X.save();X.translate(x,y);X.fillStyle='#3d2917';X.fillRect(-6*scale,4*scale,12*scale,30*scale);for(let i=0;i<3;i++){X.fillStyle=i===1?'#3e8b52':'#28633d';X.beginPath();X.arc((i-1)*13*scale,-10*scale,22*scale,0,7);X.fill()}X.fillStyle='#67ad68';X.beginPath();X.arc(0,-28*scale,16*scale,0,7);X.fill();X.restore()}
function gold(x,y){X.save();X.translate(x,y);X.fillStyle='#7e6330';X.beginPath();X.arc(0,10,27,0,7);X.fill();X.fillStyle='#f3c74c';for(let i=0;i<5;i++){X.beginPath();X.moveTo(-22+i*10,-4);X.lineTo(-14+i*10,-24);X.lineTo(-4+i*10,-6);X.closePath();X.fill()}X.restore()}
function drawBuilding(b){let enemy=b.f;X.save();X.translate(b.x,b.y);if(b.t==='core'){X.fillStyle=enemy?'#582d2c':'#245c72';X.beginPath();X.moveTo(-b.r,-b.r*.45);X.lineTo(-b.r*.65,-b.r);X.lineTo(b.r*.65,-b.r);X.lineTo(b.r,-b.r*.45);X.lineTo(b.r,b.r);X.lineTo(-b.r,b.r);X.closePath();X.fill();X.fillStyle=enemy?'#d45745':'#52b7dc';X.fillRect(-22,-30,44,68);X.fillStyle='#8d6a32';X.fillRect(-9,12,18,26);X.fillStyle='#ffd86a';X.beginPath();X.moveTo(-45,-55);X.lineTo(-15,-82);X.lineTo(15,-55);X.lineTo(45,-82);X.lineTo(45,-52);X.lineTo(-45,-52);X.fill()}else if(b.t==='barracks'){X.fillStyle=enemy?'#67342f':'#385f48';X.fillRect(-b.r,-b.r*.45,b.r*2,b.r*1.45);X.fillStyle=enemy?'#a34a38':'#b48a43';X.beginPath();X.moveTo(-b.r-5,-b.r*.45);X.lineTo(0,-b.r-12);X.lineTo(b.r+5,-b.r*.45);X.fill();X.fillStyle='#24170f';X.fillRect(-12,5,24,25)}else if(b.t==='tower'){X.fillStyle=enemy?'#67332f':'#315b4c';X.beginPath();X.moveTo(-b.r*.7,b.r);X.lineTo(-b.r*.45,-b.r);X.lineTo(b.r*.45,-b.r);X.lineTo(b.r*.7,b.r);X.closePath();X.fill();X.fillStyle='#b98b42';X.fillRect(-b.r*.55,-b.r-10,b.r*1.1,16);X.fillStyle='#17110b';X.fillRect(-9,-b.r+8,18,25);X.strokeStyle='#e9c35e';X.lineWidth=3;X.strokeRect(-b.r*.55,-b.r-10,b.r*1.1,16)}else{X.fillStyle='#80502d';X.fillRect(-30,-20,60,50);X.fillStyle='#b86d3e';X.beginPath();X.moveTo(-36,-20);X.lineTo(0,-48);X.lineTo(36,-20);X.fill()}X.restore();health(b)}
function drawUnit(a){X.save();X.translate(a.x,a.y);let enemy=a.f;let body=enemy?'#b84a3e':'#4eb4d8';if(a.t==='worker')body=enemy?'#9a6b3d':'#6caa69';if(a.t==='archer')body=enemy?'#a95b51':'#cf75a8';if(a.t==='guard')body=enemy?'#8c3f37':'#6c7f93';X.fillStyle='#0005';X.beginPath();X.ellipse(0,12,a.r*1.25,6,0,0,7);X.fill();X.fillStyle=body;X.beginPath();X.arc(0,0,a.r,0,7);X.fill();X.fillStyle='#d9b07b';X.beginPath();X.arc(0,-a.r*.75,a.r*.55,0,7);X.fill();X.fillStyle='#d8bd55';if(a.t==='archer'){X.strokeStyle='#e9d9a6';X.lineWidth=3;X.beginPath();X.arc(5,0,13,-1.1,1.1);X.stroke();X.strokeStyle='#caa86a';X.beginPath();X.moveTo(5,-13);X.lineTo(5,13);X.stroke()}else if(a.t==='blade'){X.fillRect(10,-18,4,28);X.fillStyle='#9aa8b0';X.fillRect(12,-28,3,16)}else if(a.t==='guard'){X.fillStyle='#d6b45a';X.beginPath();X.arc(-10,0,10,0,7);X.fill()}else{X.fillStyle='#d4a95d';X.fillRect(-4,-20,8,13)}if(a.hitFlash>0){X.strokeStyle='#fff';X.lineWidth=3;X.beginPath();X.arc(0,0,a.r+5,0,7);X.stroke()}X.restore();health(a);if(a===sel){X.strokeStyle='#ffe16d';X.lineWidth=2;X.beginPath();X.ellipse(a.x,a.y+15,a.r+6,4,0,0,7);X.stroke()}}
function health(a){let pct=Math.max(0,a.h/a.m);X.fillStyle='#0009';X.fillRect(a.x-22,a.y-a.r-18,44,5);X.fillStyle=pct>.45?'#55c96a':'#e45a4f';X.fillRect(a.x-21,a.y-a.r-17,42*pct,3)}
function draw(){X.clearRect(0,0,W,H);X.save();X.translate(W/2,H/2);X.scale(zoom,zoom);X.translate(-cam.x,-cam.y);let grad=X.createLinearGradient(0,0,0,WORLD.h);grad.addColorStop(0,'#173e30');grad.addColorStop(1,'#0d291f');X.fillStyle=grad;X.fillRect(0,0,WORLD.w,WORLD.h);X.fillStyle='#174253';X.fillRect(1450,0,260,WORLD.h);X.fillStyle='#245a68';for(let y=80;y<WORLD.h;y+=110){X.fillRect(1450,y,260,5)}X.strokeStyle='#ffffff08';X.lineWidth=1;for(let x=0;x<WORLD.w;x+=100){X.beginPath();X.moveTo(x,0);X.lineTo(x,WORLD.h);X.stroke()}for(let y=0;y<WORLD.h;y+=100){X.beginPath();X.moveTo(0,y);X.lineTo(WORLD.w,y);X.stroke()}for(const n of nodes)if(n.n>0){if(n.t==='gold')gold(n.x,n.y);else tree(n.x,n.y,1.15)}for(const b of buildings)drawBuilding(b);for(const a of units)drawUnit(a);for(const f of fx){if(f.type==='hit'){X.strokeStyle='#ffd66b';X.lineWidth=3;X.beginPath();X.arc(f.x,f.y,12+f.t*30,0,7);X.stroke()}if(f.type==='arrow'||f.type==='bolt'){X.strokeStyle=f.type==='bolt'?'#8ff6ff':'#f2dfaa';X.lineWidth=3;X.beginPath();X.moveTo(f.x,f.y);X.lineTo(f.tx,f.ty);X.stroke()}if(f.type==='boom'){X.strokeStyle='#ff9c43';X.lineWidth=5;X.beginPath();X.arc(f.x,f.y,10+f.t*70,0,7);X.stroke()}}X.restore()}
C.onpointerdown=e=>{if(!run)return;drag={sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,moved:false}};
C.onpointermove=e=>{if(!drag)return;let dx=e.clientX-drag.lx,dy=e.clientY-drag.ly;if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>7)drag.moved=true;if(drag.moved){cam.x-=dx/zoom;cam.y-=dy/zoom;cam.x=clamp(cam.x,W/2/zoom,WORLD.w-W/2/zoom);cam.y=clamp(cam.y,H/2/zoom,WORLD.h-H/2/zoom)}drag.lx=e.clientX;drag.ly=e.clientY};
C.onpointerup=e=>{if(!drag)return;let d=drag;drag=null;if(d.moved)return;let q=wp(e.clientX,e.clientY),h=findUnit(q.x,q.y)||findBuilding(q.x,q.y);if(placing&&sel&&sel.t==='worker'){addBuilding(placing,q.x,q.y);placing=null;renderPanel();return}if(sel&&sel.f===0&&sel.t!=='worker'&&h&&h.f===1){sel.target=h;say('Hujum!');return}if(sel&&sel.f===0&&sel.t!=='worker'&&!h){sel.order=q;say('Buyruq berildi');return}if(h&&h.f===0)select(h);else{sel=null;renderPanel()}};
C.onwheel=e=>{zoom=clamp(zoom*(e.deltaY<0?1.1:.9),.55,1.65)};
let touchDist=0;C.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();let a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(touchDist){zoom=clamp(zoom*d/touchDist,.55,1.65)}touchDist=d}},{passive:false});C.addEventListener('touchend',()=>touchDist=0);
document.getElementById('go').onclick=()=>{setup();run=true;document.getElementById('start').classList.add('hidden');cam={x:800,y:1050};say('Boshladik! 7 ishchi avtomatik ishlaydi.');};
function loop(now){let dt=Math.min(.04,(now-last)/1000);last=now;if(run)update(dt);draw();requestAnimationFrame(loop)}setup();requestAnimationFrame(loop);
</script>
</body>
</html>
